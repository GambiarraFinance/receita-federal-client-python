[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "receita-federal-client"
version = "1.0.0"
description = "Cliente Python para integração com as APIs open source da Receita Federal do Brasil: Simples Nacional, Regime Geral e Gerador DANFSe (LC 214/2025)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "GambiarraFinance", email = "contato@gambiarrafinance.com" },
]
keywords = [
    "receita-federal",
    "simples-nacional",
    "regime-geral",
    "danfse",
    "cbs",
    "ibs",
    "imposto-seletivo",
    "nfse",
    "nfe",
    "brasil",
    "tributos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/GambiarraFinance/receita-federal-client-python"
"Bug Tracker" = "https://github.com/GambiarraFinance/receita-federal-client-python/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=receita_federal_client --cov-report=term-missing --cov-fail-under=100"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N"]

[tool.mypy]
python_version = "3.9"
strict = true
